<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | MLM Savings Scheme</title>
  <meta name="description" content="Member login for MLM Savings Scheme" />
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="header">
    <div class="container topbar">
      <div class="brand">
        <img src="/assets/logo.svg" alt="logo">
        <h1>MLM Savings</h1>
      </div>
      <nav class="nav">
        <a href="/index.html">Home</a>
        <a href="/registration.html">Register</a>
        <a href="/admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <section class="card login-card">
      <h2>Login</h2>
      <p>Demo user login for the membership portal.</p>
      <form id="loginForm">
        <label>
          Username
          <input type="text" name="username" required placeholder="Enter username" />
        </label>
        <label>
          Password
          <input type="password" name="password" required placeholder="Enter password" />
        </label>
        <button type="submit" class="btn primary">Login</button>
      </form>
      <div id="loginMessage" class="status-box">Demo login: member / member123</div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 MLM Savings</p>
    </div>
  </footer>

  <script src="/api.js"></script>
  <script src="/app.js"></script>
</body>
</html>
